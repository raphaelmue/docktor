name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      BETTER_AUTH_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn exec prisma generate --config=server/prisma/prisma.config.ts

      - name: Build
        run: yarn build

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests (client + shared)
        run: yarn test:unit

      - name: Server tests (unit + integration combined for accurate coverage)
        run: yarn workspace @docktor/server test

      - name: Install Playwright browsers
        run: yarn workspace @docktor/client exec playwright install --with-deps chromium

      - name: Client integration tests
        env:
          VITE_COVERAGE: "true"
        run: yarn test:integration

      - name: Fix coverage paths for SonarQube
        if: always()
        run: |
          for pkg in server client shared; do
            lcov="$pkg/.test/coverage/lcov.info"
            if [ -f "$lcov" ]; then
              sed -i "s|^SF:src/|SF:$pkg/src/|" "$lcov"
            fi
          done

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            server/.test/coverage/lcov.info
            client/.test/coverage/lcov.info
            shared/.test/coverage/lcov.info
          retention-days: 5

  sonarqube:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports

      - name: SonarQube Scan for PR
        uses: sonarsource/sonarqube-scan-action@v7
        if: github.event_name == 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            --define sonar.pullrequest.key=${{ github.event.pull_request.number }}
            --define sonar.pullrequest.branch=${{ github.head_ref || github.ref_name }}
            --define sonar.pullrequest.base=main

      - name: SonarQube Scan for Main
        uses: sonarsource/sonarqube-scan-action@v7
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            --define sonar.branch.name=main
