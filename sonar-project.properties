sonar.projectKey=docktor
sonar.projectName=Docktor

sonar.sources=shared/src,server/src,client/src
sonar.tests=server/test,client/test,shared/test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts

sonar.typescript.lcov.reportPaths=server/.test/coverage/lcov.info,client/.test/coverage/lcov.info,shared/.test/coverage/lcov.info

sonar.coverage.exclusions=\
  **/generated/**,\
  **/node_modules/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  client/src/components/ui/**,\
  client/src/routes/**,\
  client/src/main.tsx,\
  server/src/index.ts,\
  server/src/app.ts,\
  server/src/routes/**,\
  server/src/infrastructure/**,\
  server/src/repositories/**,\
  server/src/lib/auth.ts,\
  server/src/lib/auth-middleware.ts,\
  server/src/lib/db.ts

sonar.exclusions=**/generated/**,**/node_modules/**,**/dist/**

# False positives in generated/wrapper components
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S5256
sonar.issue.ignore.multicriteria.e1.resourceKey=client/src/components/ui/table.tsx
sonar.issue.ignore.multicriteria.e2.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.e2.resourceKey=client/src/index.css
